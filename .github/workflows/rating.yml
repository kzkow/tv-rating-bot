name: TradingView rating

on:
  # Основной запуск — workflow_dispatch через API от внешнего планировщика (cron-job.org):
  # свой cron GitHub исполняет раз в 3–4 часа. Он оставлен как запасной.
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      summary:
        description: "Прислать сводку оценки TradingView по всем бумагам"
        type: boolean
        # false: запуск через API без inputs не должен слать сводку.
        default: false

permissions:
  contents: write

# Проверки идут строго по одной, чтобы не было гонки за alerts_state.json.
concurrency:
  group: tv-rating
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ref: main — свежая вершина ветки, а не SHA момента вызова: запуск из очереди
      # иначе увидел бы состояние до коммита предыдущего запуска и прислал бы то же повторно.
      - uses: actions/checkout@v5
        with:
          ref: main

      # Оценку TradingView по расписанию не опрашиваем: она приходит строкой в сообщениях Mega Alerts.
      # Сводка — только по ручному запуску с галочкой.
      - name: Send summary
        if: inputs.summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      # Mega Alerts MOEX ALGOPACK с текущей оценкой TradingView. Работает и если упала сводка;
      # таймаут шага не отменяет Save state.
      - name: Check Mega Alerts
        if: success() || failure()
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}
        run: python3 alerts.py

      # Состояние хранится в репозитории; коммит только когда оно изменилось.
      # alerts_state.json появляется не сразу (без ключа его нет) — отсюда проверка.
      - name: Save state
        if: success() || failure()
        run: |
          if [ -f alerts_state.json ]; then git add alerts_state.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update state"
            git pull --rebase
            git push
          fi
